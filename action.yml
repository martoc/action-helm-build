---
name: "Deploys a Helm Chart"
description: |
  This action packages a Helm chart at TAG_VERSION and pushes it to an OCI registry
  (Docker Hub, Google Artifact Registry, AWS ECR or the GitHub Container Registry).
author: martoc
inputs:
  registry:
    description: "Registry to push the Helm chart to (default: docker.io) valid values: docker.io, gcp, aws, github"
    required: false
    default: "docker.io"
  region:
    description: "Region to push the container to valid values: google cloud or aws regions"
    required: false
    default: ""
  repository_name:
    description: "Repository Name: Artifact Registry repository, ECR namespace, Docker Hub namespace (default: DOCKER_USERNAME) or ghcr.io namespace (default: the repository owner)"
    required: false
    default: ""
  aws_account_id:
    description: "AWS Account ID"
    required: false
    default: ""
  gcp_project_id:
    description: "Google Cloud Project ID"
    required: false
    default: ""
  chart_path:
    description: "Directory that holds Chart.yaml, relative to the repository root"
    required: false
    default: "."
  app_version:
    description: "Sets appVersion in Chart.yaml when not empty, e.g. the TAG_VERSION of the images the chart installs"
    required: false
    default: ""
  github_token:
    description: >-
      Token that pushes to the GitHub Container Registry (ghcr.io) with
      registry 'github'. Defaults to the workflow's GITHUB_TOKEN, which needs
      'packages: write' in the calling job.
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: "Set up Cloud SDK"
      uses: google-github-actions/setup-gcloud@v2
      with:
        version: 499.0.0
      if: ${{ inputs.registry == 'gcp' }}
    - name: Setup Helm Chart
      shell: bash
      env:
        CHART_PATH: ${{ inputs.chart_path }}
        APP_VERSION: ${{ inputs.app_version }}
      run: |
        yq e ".version = \"$TAG_VERSION\"" -i "${CHART_PATH}/Chart.yaml"
        if [ -n "${APP_VERSION}" ]; then
          yq e ".appVersion = \"$APP_VERSION\"" -i "${CHART_PATH}/Chart.yaml"
        fi
    - name: Package Helm chart
      shell: bash
      env:
        CHART_PATH: ${{ inputs.chart_path }}
      run: |
        helm package "${CHART_PATH}"
    - name: Publish Helm chart
      shell: bash
      env:
        CHART_PATH: ${{ inputs.chart_path }}
        GHCR_TOKEN: ${{ inputs.github_token }}
      run: |
        NAME=$(yq .name "${CHART_PATH}/Chart.yaml")

        if [ -n "${{ inputs.registry }}" ]; then
          REGISTRY="${{ inputs.registry }}"
        fi

        if [ -n "${{ inputs.region }}" ]; then
          REGION="${{ inputs.region }}"
        fi

        if [ -n "${{ inputs.repository_name }}" ]; then
          REPOSITORY_NAME="${{ inputs.repository_name }}"
        fi

        if [ -n "${{ inputs.gcp_project_id }}" ]; then
          GCP_PROJECT_ID="${{ inputs.gcp_project_id }}"
        fi

        if [ -n "${{ inputs.aws_account_id }}" ]; then
          ACCOUNT_ID="${{ inputs.aws_account_id }}"
        fi

        if [ "${REGISTRY}" = "docker.io" ]; then
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo "DOCKER_USERNAME and DOCKER_PASSWORD must be set when using docker.io registry"
            exit 1
          fi
          if [ -z "${REPOSITORY_NAME}" ]; then
            REPOSITORY_NAME="${DOCKER_USERNAME}"
          fi
          echo "${DOCKER_PASSWORD}" | helm registry login registry-1.docker.io --username "${DOCKER_USERNAME}" --password-stdin
          REGISTRY_URL="oci://registry-1.docker.io/${REPOSITORY_NAME}"
        elif [ "${REGISTRY}" = "gcp" ]; then
          if [ -z "${REGION}" ]; then
            echo "REGION must be set when using 'gcp' registry"
            exit 1
          fi
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "GCP_PROJECT_ID must be set when using 'gcp' registry"
            exit 1
          fi
          if  [ -z "${REPOSITORY_NAME}" ]; then
            echo "REPOSITORY_NAME must be set when using 'gcp' registry"
            exit 1
          fi
          gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin https://${REGION}-docker.pkg.dev
          REGISTRY_URL="oci://${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY_NAME}"
        elif [ "${REGISTRY}" = "aws" ]; then
          if [ -z "${REGION}" ]; then
            echo "REGION must be set when using 'aws' registry"
            exit 1
          fi
          if [ -z "${ACCOUNT_ID}" ]; then
            echo "ACCOUNT_ID must be set when using 'aws' registry, use aws_account_id input or ACCOUNT_ID envar"
            exit 1
          fi
          if ! echo "${ACCOUNT_ID}" | grep -qE '^[0-9]{12}$'; then
            echo "ACCOUNT_ID must be a 12-digit AWS account ID, got: ${ACCOUNT_ID}"
            exit 1
          fi
          if [ -z "${REPOSITORY_NAME}" ]; then
            echo "REPOSITORY_NAME must be set when using 'aws' registry"
            exit 1
          fi
          aws ecr get-login-password --region ${REGION} | helm registry login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com
          REGISTRY_URL="oci://${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPOSITORY_NAME}"
        elif [ "${REGISTRY}" = "github" ]; then
          if [ -z "${REPOSITORY_NAME}" ]; then
            REPOSITORY_NAME="${{ github.repository_owner }}"
          fi
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "github_token must be set when using 'github' registry"
            exit 1
          fi
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          # GHCR accepts only lower case repository paths.
          REGISTRY_URL="oci://ghcr.io/${REPOSITORY_NAME,,}"
        else
          echo "Unknown registry: ${REGISTRY}. Valid values are:"
          echo "  - docker.io"
          echo "  - gcp"
          echo "  - aws"
          echo "  - github"
          exit 1
        fi
        helm push ${NAME}-${TAG_VERSION}.tgz ${REGISTRY_URL}
